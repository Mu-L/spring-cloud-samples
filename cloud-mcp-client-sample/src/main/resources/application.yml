server:
  port: 8890
spring:
  application:
    name: mcp-client-sample
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        model: qwen-plus
        temperature: 0.7
    mcp:
      client:
        name: spacecloud-mcp-client
        type: sync
        streamable-http:
          connections:
            ai-sample:
              url: http://localhost:8888
              endpoint: /mcp
