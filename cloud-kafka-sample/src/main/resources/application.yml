server:
  port: 8768

app:
  kafka:
    topic: testTopic
    share-topic: share-demo-topic
    share-topic-explicit: share-demo-topic-explicit
    share-group: share-demo-group
    tx-topic: tx-demo-topic

spring:
  application:
    name: kafka-sample
  cloud:
    nacos:
      username: nacos
      password: 7fDJZBbiLzO2
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  kafka:
    bootstrap-servers: localhost:9092,localhost:9094,localhost:9096
    consumer:
      group-id: testGroup
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: org.hongxi.cloud.sample.kafka
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info
