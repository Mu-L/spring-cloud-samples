server:
  port: 8888
spring:
  application:
    name: ai-sample
  cloud:
    nacos:
      username: nacos
      password: 7fDJZBbiLzO2
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        model: qwen-plus
        temperature: 0.7
      vision:
        model: qwen3.7-plus # 多模态视觉模型（需支持图像输入）
    mcp:
      server:
        name: spring-cloud-samples-mcp-server    # MCP 服务名称，Client 连接时使用
        version: 1.0.0                            # 服务版本
        type: SYNC                                # 运行模式：SYNC（同步）或 ASYNC（异步）

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info
