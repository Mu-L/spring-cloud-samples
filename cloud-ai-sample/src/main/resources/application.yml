server:
  port: 8888
spring:
  application:
    name: ai-sample
  cloud:
    nacos:
      username: nacos
      password: 7fDJZBbiLzO2
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        model: qwen-plus
        temperature: 0.7
      multimodal:
        model: qwen3.7-plus # 多模态模型（视觉理解 + 图片生成）
      image:
        model: wan2.7-image-pro # 图片生成模型（DashScope文生图）
    mcp:
      server:
        name: spacecloud-mcp-server
        version: 1.0.0
        protocol: streamable
        type: sync

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info
